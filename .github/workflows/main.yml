name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: FiePaw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
          fetch-depth: 0

      - name: Fetch stats SVG
        run: |
          curl -f "https://github-readme-stats.vercel.app/api?username=FiePaw&show_icons=true&theme=dracula&hide_border=true&border_radius=8" -o stats.svg || echo "stats fetch failed"

      - name: Fetch top languages SVG
        run: |
          curl -f "https://github-readme-stats.vercel.app/api/top-langs/?username=FiePaw&layout=compact&theme=dracula&hide_border=true&border_radius=8" -o langs.svg || echo "langs fetch failed"

      - name: Fetch streak SVG
        run: |
          curl -f "https://streak-stats.demolab.com?user=FiePaw&theme=dracula&hide_border=true&border_radius=8" -o streak.svg || echo "streak fetch failed"

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update stats [skip ci]"
          git push
